name: Agentic Benchmark - Nightly 2 AM IST

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  agentic-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn numpy pytest allure-pytest pandas
      
      - name: Build Vector DB
        run: |
          python rag_vector/app.py --build-db --docs ./docs/BRD_dummy.txt
          python rag_vector/app.py --query "Madras to Trivandrum train"
      
      - name: Run Tests
        run: |
          python -m pytest tests/ -v --alluredir=allure-results
      
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results